<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Surprise For You 💗</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --pink: #ff5f9e;
      --deep-pink: #e93d82;
      --purple: #9b6cff;
      --text: #59384f;
      --soft-text: #876879;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      position: relative;

      font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(255, 157, 202, 0.72),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(180, 143, 255, 0.62),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #ffdce9 0%,
          #f8e4f2 48%,
          #e9defd 100%
        );
    }

    /* =========================================
       SOFT BACKGROUND GLOW
    ========================================= */

    .glow {
      position: absolute;
      width: 55vw;
      height: 55vw;
      max-width: 650px;
      max-height: 650px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.22);

      filter: blur(80px);

      pointer-events: none;
    }

    .glow.one {
      top: -25%;
      left: -15%;
    }

    .glow.two {
      bottom: -30%;
      right: -15%;
    }

    /* =========================================
       FLOWING HEARTS + FLOWERS
    ========================================= */

    .floating {
      position: absolute;
      top: -80px;

      z-index: 1;

      pointer-events: none;

      opacity: 0;

      animation-name: gentleFall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;

      will-change: transform, opacity;
    }

    @keyframes gentleFall {

      0% {
        transform:
          translate3d(0, -80px, 0)
          rotate(0deg)
          scale(0.75);

        opacity: 0;
      }

      10% {
        opacity: 0.42;
      }

      50% {
        opacity: 0.58;
      }

      90% {
        opacity: 0.32;
      }

      100% {
        transform:
          translate3d(55px, 115vh, 0)
          rotate(180deg)
          scale(1);

        opacity: 0;
      }
    }

    .f1 {
      left: 4%;
      font-size: 20px;
      animation-duration: 18s;
      animation-delay: -4s;
    }

    .f2 {
      left: 12%;
      font-size: 16px;
      animation-duration: 23s;
      animation-delay: -12s;
    }

    .f3 {
      left: 21%;
      font-size: 25px;
      animation-duration: 20s;
      animation-delay: -7s;
    }

    .f4 {
      left: 31%;
      font-size: 18px;
      animation-duration: 26s;
      animation-delay: -16s;
    }

    .f5 {
      left: 42%;
      font-size: 23px;
      animation-duration: 21s;
      animation-delay: -10s;
    }

    .f6 {
      left: 54%;
      font-size: 17px;
      animation-duration: 24s;
      animation-delay: -18s;
    }

    .f7 {
      left: 65%;
      font-size: 24px;
      animation-duration: 19s;
      animation-delay: -6s;
    }

    .f8 {
      left: 76%;
      font-size: 18px;
      animation-duration: 25s;
      animation-delay: -14s;
    }

    .f9 {
      left: 88%;
      font-size: 22px;
      animation-duration: 22s;
      animation-delay: -3s;
    }

    .f10 {
      left: 94%;
      font-size: 16px;
      animation-duration: 27s;
      animation-delay: -20s;
    }

    /* =========================================
       MAIN CARD
    ========================================= */

    .card {
      position: relative;
      z-index: 10;

      width: min(92vw, 480px);

      padding: 44px 38px 38px;

      text-align: center;

      /*
        Strong glass effect:
        white transparent background + blur
      */

      background: rgba(255, 255, 255, 0.38);

      backdrop-filter: blur(30px) saturate(135%);
      -webkit-backdrop-filter: blur(30px) saturate(135%);

      border: 1px solid rgba(255, 255, 255, 0.7);

      border-radius: 32px;

      box-shadow:
        0 30px 80px rgba(108, 48, 91, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);

      animation: cardEnter 1.1s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes cardEnter {

      from {
        opacity: 0;
        transform: translateY(28px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* =========================================
       TOP HEART
    ========================================= */

    .main-heart {
      width: 76px;
      height: 76px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.72),
          rgba(255,220,236,.45)
        );

      box-shadow:
        0 14px 35px rgba(229, 69, 132, 0.18),
        inset 0 1px 0 rgba(255,255,255,.9);

      font-size: 38px;

      animation: heartPulse 2.8s ease-in-out infinite;
    }

    @keyframes heartPulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.07);
      }
    }

    /* =========================================
       TEXT
    ========================================= */

    .eyebrow {
      margin-bottom: 9px;

      color: var(--deep-pink);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      color: var(--text);

      font-size: clamp(29px, 7vw, 42px);

      font-weight: 750;

      letter-spacing: -1px;

      margin-bottom: 12px;
    }

    .subtitle {
      max-width: 360px;

      margin: 0 auto 29px;

      color: var(--soft-text);

      font-size: 15px;
      line-height: 1.7;
    }

    /* =========================================
       CODE LABEL
    ========================================= */

    .code-label {
      display: block;

      margin-bottom: 12px;

      color: var(--text);

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 0.3px;
    }

    /* =========================================
       8 DIGIT BOXES
    ========================================= */

    .code-container {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: clamp(4px, 1.7vw, 9px);

      /*
        VERY IMPORTANT:
        no wrapping on mobile
      */

      flex-wrap: nowrap;

      margin-bottom: 22px;
    }

    .code-box {
      flex: 1 1 0;

      /*
        Eight boxes ALWAYS remain in one row.
      */

      min-width: 0;

      aspect-ratio: 1 / 1;

      max-width: 46px;

      border: 1.5px solid rgba(255, 255, 255, 0.95);

      border-radius: 13px;

      background: rgba(255, 255, 255, 0.52);

      box-shadow:
        inset 0 1px 2px rgba(255,255,255,.9),
        0 7px 18px rgba(112, 56, 99, 0.07);

      outline: none;

      text-align: center;

      color: var(--text);

      font-size: clamp(18px, 5vw, 22px);

      font-weight: 700;

      transition:
        border-color .25s ease,
        background .25s ease,
        transform .25s ease,
        box-shadow .25s ease;
    }

    .code-box:focus {
      border-color: rgba(233, 61, 130, 0.75);

      background: rgba(255,255,255,.78);

      box-shadow:
        0 0 0 4px rgba(233,61,130,.09),
        0 10px 22px rgba(112,56,99,.1);

      transform: translateY(-2px);
    }

    /* =========================================
       CONTINUE BUTTON
    ========================================= */

    .continue-btn {
      width: 100%;
      height: 56px;

      border: 0;
      border-radius: 17px;

      cursor: pointer;

      color: white;

      font-size: 15px;
      font-weight: 750;

      letter-spacing: .2px;

      background:
        linear-gradient(
          135deg,
          #ff609e,
          #e94d91 48%,
          #9d70ed
        );

      box-shadow:
        0 14px 30px rgba(213, 76, 143, .25);

      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .continue-btn:hover {
      transform: translateY(-3px);

      box-shadow:
        0 18px 35px rgba(213, 76, 143, .32);
    }

    .continue-btn:active {
      transform: scale(.985);
    }

    /* =========================================
       ERROR
    ========================================= */

    .error {
      height: 20px;

      margin-top: 12px;

      color: #dc4c76;

      font-size: 12px;

      opacity: 0;

      transition: opacity .25s ease;
    }

    .error.show {
      opacity: 1;
    }

    .bottom-text {
      margin-top: 12px;

      color: #a48398;

      font-size: 11px;
    }

    /* =========================================
       SMALL MOBILE DEVICES
    ========================================= */

    @media (max-width: 390px) {

      .card {
        width: 94vw;

        padding:
          30px
          17px
          27px;

        border-radius: 27px;
      }

      .main-heart {
        width: 65px;
        height: 65px;

        font-size: 31px;

        margin-bottom: 15px;
      }

      h1 {
        font-size: 29px;
      }

      .subtitle {
        font-size: 13px;

        margin-bottom: 24px;
      }

      .code-container {
        gap: 4px;
      }

      .code-box {
        border-radius: 10px;

        font-size: 16px;
      }

      .continue-btn {
        height: 52px;
      }
    }

    /* =========================================
       REDUCED MOTION ACCESSIBILITY
    ========================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- Soft background -->
  <div class="glow one"></div>
  <div class="glow two"></div>

  <!-- Slow falling hearts & flowers -->
  <div class="floating f1">🌸</div>
  <div class="floating f2">💗</div>
  <div class="floating f3">🌷</div>
  <div class="floating f4">💕</div>
  <div class="floating f5">🌸</div>
  <div class="floating f6">💖</div>
  <div class="floating f7">🌺</div>
  <div class="floating f8">💞</div>
  <div class="floating f9">🌷</div>
  <div class="floating f10">💓</div>


  <!-- Main glass card -->
  <main class="card">

    <div class="main-heart">
      💗
    </div>

    <div class="eyebrow">
      A little surprise
    </div>

    <h1>Hey, Sister ✨</h1>

    <p class="subtitle">
      There is something special waiting for you.
      <br>
      But first... prove that you're the one. 👀
    </p>


    <label class="code-label">
      🔐 Enter your birth date
    </label>


    <!-- EXACTLY 8 BOXES -->
    <div class="code-container">

      <input
        class="code-box"
        type="text"
        inputmode="numeric"
        maxlength="1"
        autocomplete="off"
      >

      <input
        class="code-box"
        type="text"
        inputmode="numeric"
        maxlength="1"
        autocomplete="off"
      >

      <input
        class="code-box"
        type="text"
        inputmode="numeric"
        maxlength="1"
        autocomplete="off"
      >

      <input
        class="code-box"
        type="text"
        inputmode="numeric"
        maxlength="1"
        autocomplete="off"
      >

      <input
        class="code-box"
        type="text"
        inputmode="numeric"
        maxlength="1"
        autocomplete="off"
      >

      <input
        class="code-box"
        type="text"
        inputmode="numeric"
        maxlength="1"
        autocomplete="off"
      >

      <input
        class="code-box"
        type="text"
        inputmode="numeric"
        maxlength="1"
        autocomplete="off"
      >

      <input
        class="code-box"
        type="text"
        inputmode="numeric"
        maxlength="1"
        autocomplete="off"
      >

    </div>


    <button
      class="continue-btn"
      id="continueBtn"
      type="button"
    >
      Continue with the surprise 💖
    </button>


    <div
      class="error"
      id="errorMessage"
    >
      Hmm... that doesn't look right. Try again 💗
    </div>


    <div class="bottom-text">
      Made with a little bit of love ✨
    </div>

  </main>


  <script>

    /*
    ==================================================
      YOUR 8-DIGIT CODE
    ==================================================

      Abhi demo ke liye:

      12345678

      Baad mein sirf yahi number change karna.
    */

    const SECRET_CODE = "22082008";


    const boxes = [
      ...document.querySelectorAll(".code-box")
    ];

    const button =
      document.getElementById("continueBtn");

    const error =
      document.getElementById("errorMessage");


    /*
    ==================================================
      AUTO MOVE TO NEXT BOX
    ==================================================
    */

    boxes.forEach((box, index) => {

      box.addEventListener("input", () => {

        /*
          Sirf number allow
        */

        box.value =
          box.value.replace(/\D/g, "");


        /*
          Next box automatically focus
        */

        if (
          box.value &&
          index < boxes.length - 1
        ) {
          boxes[index + 1].focus();
        }

        error.classList.remove("show");
      });


      /*
      ==================================================
        BACKSPACE → PREVIOUS BOX
      ==================================================
      */

      box.addEventListener("keydown", (event) => {

        if (
          event.key === "Backspace" &&
          !box.value &&
          index > 0
        ) {
          boxes[index - 1].focus();
        }

        /*
          Enter → Continue
        */

        if (event.key === "Enter") {
          checkCode();
        }

      });


      /*
      ==================================================
        PASTE 8 DIGITS
      ==================================================
      */

      box.addEventListener("paste", (event) => {

        event.preventDefault();

        const pasted =
          event.clipboardData
            .getData("text")
            .replace(/\D/g, "")
            .slice(0, 8);

        pasted.split("").forEach((digit, i) => {

          if (boxes[i]) {
            boxes[i].value = digit;
          }

        });

        if (pasted.length > 0) {

          const focusIndex =
            Math.min(
              pasted.length,
              boxes.length - 1
            );

          boxes[focusIndex].focus();
        }

      });

    });


    /*
    ==================================================
      CHECK CODE
    ==================================================
    */

    function checkCode() {

      const enteredCode =
        boxes
          .map(box => box.value)
          .join("");


      /*
        Empty / incomplete
      */

      if (enteredCode.length !== 8) {

        showError(
          "Please enter all 8 digits first 💗"
        );

        shakeBoxes();

        return;
      }


      /*
        Correct code
      */

      if (enteredCode === SECRET_CODE) {

        error.classList.remove("show");

        /*
          Smooth fade-out
        */

        document.body.style.transition =
          "opacity .7s ease";

        document.body.style.opacity = "0";


        /*
          Redirect to birthday page
        */

        setTimeout(() => {

          window.location.href =
            "birthday.html";

        }, 700);

      }


      /*
        Wrong code
      */

      else {

        showError(
          "Almost... but that's not the secret code 😏💗"
        );

        shakeBoxes();

        boxes.forEach(box => {
          box.value = "";
        });

        boxes[0].focus();
      }

    }


    /*
    ==================================================
      ERROR
    ==================================================
    */

    function showError(message) {

      error.textContent = message;

      error.classList.add("show");

    }


    /*
    ==================================================
      SHAKE ANIMATION
    ==================================================
    */

    function shakeBoxes() {

      document
        .querySelector(".code-container")
        .animate(

          [
            {
              transform: "translateX(0)"
            },

            {
              transform: "translateX(-8px)"
            },

            {
              transform: "translateX(8px)"
            },

            {
              transform: "translateX(-5px)"
            },

            {
              transform: "translateX(5px)"
            },

            {
              transform: "translateX(0)"
            }
          ],

          {
            duration: 400,
            easing: "ease"
          }

        );

    }


    /*
    ==================================================
      BUTTON
    ==================================================
    */

    button.addEventListener(
      "click",
      checkCode
    );


    /*
    ==================================================
      START FROM FIRST BOX
    ==================================================
    */

    boxes[0].focus();

  </script>

</body>
</html>
