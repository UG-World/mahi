<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<style>

.app-download-actions {
    width: min(92%, 440px);
    margin: 24px auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-sizing: border-box;
}

.app-download-actions a {
    display: block;
    width: 100%;
    padding: 16px 20px;
    box-sizing: border-box;
    border-radius: 14px;
    text-align: center;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: clamp(14px, 3.5vw, 17px);
    font-weight: 700;
    line-height: 1.4;
    transition: transform 0.2s ease, opacity 0.2s ease;
    overflow-wrap: anywhere;
}

.app-download-actions a:hover {
    transform: translateY(-2px);
    opacity: 0.92;
}

.app-download-actions a:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 4px;
}

.memory-action {
    background: #7c3aed;
    color: #ffffff;
    border: 2px solid #a78bfa;
    box-shadow: 0 5px 18px rgba(124, 58, 237, 0.3);
}

.download-action {
    background: #16a34a;
    color: #ffffff;
    border: 2px solid #4ade80;
    box-shadow: 0 5px 18px rgba(22, 163, 74, 0.3);
}


*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  background:linear-gradient(135deg,#fff7fb,#fdf0f7);
  color:#493444;
  font-family:Arial,sans-serif;
}

/* =========================
   PAGE
========================= */

.page{
  min-height:100vh;
  padding:50px 0 70px;
  overflow:hidden;
}

.title{
  text-align:center;
  margin-bottom:30px;
  padding:0 20px;
}

.title small{
  color:#e85b98;
  font-size:10px;
  font-weight:bold;
  letter-spacing:3px;
}

.title h1{
  margin-top:8px;
  font-family:Georgia,serif;
  font-size:clamp(30px,6vw,46px);
  font-weight:500;
}

.title p{
  margin-top:8px;
  color:#9b8191;
  font-size:13px;
}

/* =========================
   MAIN CARD
========================= */

.music-card{
  width:min(94vw,440px);
  margin:auto;
  padding:16px;

  background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.9);
  border-radius:28px;

  box-shadow:
    0 25px 70px rgba(75,35,65,.16);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

/* =========================
   PHOTO AREA
========================= */

.photo-window{
  width:100%;
  aspect-ratio:1/1;

  position:relative;
  overflow:hidden;

  border-radius:22px;

  touch-action:pan-y;
  user-select:none;

  background:#f3e8ef;
}

/*
  Horizontal photo rail.
  Main image center.
  Previous/next images remain visible
  on both sides and blurred.
*/

.photo-track{
  height:100%;
  width:max-content;

  display:flex;
  align-items:center;

  gap:12px;

  transition:
    transform .6s cubic-bezier(.22,.61,.36,1);
}

/* Individual photo */

.photo{
  width:min(calc(94vw - 32px),408px);
  aspect-ratio:1/1;

  flex-shrink:0;

  overflow:hidden;

  border-radius:19px;

  opacity:.35;
  filter:blur(7px);

  transform:scale(.80);

  transition:
    opacity .6s ease,
    filter .6s ease,
    transform .6s ease;
}

.photo.active{
  opacity:1;
  filter:blur(0);
  transform:scale(1);
}

.photo img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  pointer-events:none;

  user-select:none;
}

/* =========================
   PHOTO ARROWS
========================= */

.photo-button{
  position:absolute;

  top:50%;
  transform:translateY(-50%);

  z-index:10;

  width:38px;
  height:38px;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.72);

  color:#583b50;

  font-size:25px;

  cursor:pointer;

  box-shadow:0 7px 20px rgba(50,20,45,.12);

  backdrop-filter:blur(10px);
}

.photo-button:active{
  transform:translateY(-50%) scale(.9);
}

.photo-left{
  left:10px;
}

.photo-right{
  right:10px;
}

/* =========================
   PHOTO NUMBER
========================= */

.photo-number{
  text-align:center;

  margin-top:12px;

  font-size:10px;

  letter-spacing:2px;

  color:#a08798;
}

.photo-number strong{
  color:#e85b98;
}

/* =========================
   SPOTIFY STYLE PLAYER
========================= */

.player{
  padding:18px 4px 2px;
}

/* Song information */

.song-info{
  text-align:center;
}

.song-name{
  font-size:17px;
  font-weight:700;

  color:#493444;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  margin-top:5px;

  color:#99818f;

  font-size:11px;
}

/* =========================
   PROGRESS BAR
========================= */

.progress-area{
  display:grid;

  grid-template-columns:36px 1fr 36px;

  gap:8px;

  align-items:center;

  margin-top:17px;
}

.time{
  color:#92798a;
  font-size:9px;
}

.progress{
  width:100%;
  height:4px;

  appearance:none;
  -webkit-appearance:none;

  background:#eadde5;

  border-radius:10px;

  cursor:pointer;
}

.progress::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:12px;
  height:12px;

  border-radius:50%;

  background:#e85b98;
}

.progress::-moz-range-thumb{
  width:12px;
  height:12px;

  border:0;

  border-radius:50%;

  background:#e85b98;
}

/* =========================
   MUSIC CONTROLS
========================= */

.controls{
  display:flex;

  justify-content:center;
  align-items:center;

  gap:27px;

  margin-top:15px;
}

.music-button{
  width:35px;
  height:35px;

  border:0;

  background:transparent;

  color:#493444;

  font-size:19px;

  cursor:pointer;
}

.play-button{
  width:49px;
  height:49px;

  border:0;
  border-radius:50%;

  background:linear-gradient(
    135deg,
    #e85b98,
    #9b70dc
  );

  color:white;

  font-size:16px;

  cursor:pointer;

  box-shadow:
    0 9px 25px rgba(205,75,135,.25);
}

.music-button:active,
.play-button:active{
  transform:scale(.92);
}

/* =========================
   HINT
========================= */

.hint{
  text-align:center;

  margin-top:18px;

  color:#a58c9c;

  font-size:9px;

  letter-spacing:.7px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .page{
    padding-top:40px;
  }

  .title{
    margin-bottom:22px;
  }

  .music-card{
    width:92vw;
    padding:13px;
    border-radius:24px;
  }

  .photo-window{
    border-radius:19px;
  }

  .photo{
    width:calc(92vw - 26px);
    border-radius:17px;
  }

  .controls{
    gap:22px;
  }

  .play-button{
    width:46px;
    height:46px;
  }
}

@media(max-width:360px){

  .music-card{
    width:94vw;
  }

  .song-name{
    font-size:15px;
  }

}

  /* MOBILE — arrows completely hidden */
@media (max-width: 600px) {
  .photo-button {
    display: none !important;
  }
}
  
</style>
</head>


<body>

  <!-- App Download Buttons -->
<div class="app-download-actions">
    <a href="#photoWindow" class="memory-action">
        Save Your Memories Using Our App
    </a>

    <a href="https://github.com/UG-World/mahi/releases/download/v1.0.0/app-release.apk"
       class="download-action">
        ↓ Click for Download
    </a>
</div>


<div class="page">

  <div class="title">
    <small>THE PHOTOS OF PRINCESS</small>

    <h1>Beautiful Pictures ❤️</h1>

    <p>Swipe left or right to explore.</p>
  </div>


  <div class="music-card">

    <!-- =========================
         PHOTO SECTION
    ========================== -->

    <div
      class="photo-window"
      id="photoWindow"
    >

      <div
        class="photo-track"
        id="photoTrack"
      ></div>


      <button
        class="photo-button photo-left"
        id="photoPrev"
      >
        ‹
      </button>


      <button
        class="photo-button photo-right"
        id="photoNext"
      >
        ›
      </button>

    </div>


    <div class="photo-number">
      <strong id="photoCurrent">01</strong>
      &nbsp;/&nbsp;
      23
    </div>


    <!-- =========================
         MUSIC PLAYER
    ========================== -->

    <div class="player">

      <div class="song-info">

        <div
          class="Aarzu"
          id="aarzu"
        >
      
        </div>

        <div
          class="utsav"
          id="artist"
        >
          A little song for you ✨
        </div>

      </div>


      <!-- TIMESTAMP + PROGRESS -->

      <div class="progress-area">

        <span
          class="time"
          id="currentTime"
        >
          0:00
        </span>


        <input
          class="progress"
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
        >


        <span
          class="time"
          id="duration"
        >
          0:00
        </span>

      </div>


      <!-- CONTROLS -->

      <div class="controls">

        <button
          class="music-button"
          id="previousSong"
        >
          ⏮
        </button>


        <button
          class="play-button"
          id="playPause"
        >
          ▶
        </button>


        <button
          class="music-button"
          id="nextSong"
        >
          ⏭
        </button>

      </div>

    </div>

  </div>


  <div class="hint">
    PHOTO — SWIPE &nbsp; • &nbsp; MUSIC — ⏮ / ⏭
  </div>

</div>


<script>

/* =====================================================
   PHOTO SYSTEM
===================================================== */

const TOTAL_PHOTOS = 23;

const photoTrack =
  document.getElementById(
    "photoTrack"
  );

const photoWindow =
  document.getElementById(
    "photoWindow"
  );

const photoCurrent =
  document.getElementById(
    "photoCurrent"
  );


/* Create image1.png -> image23.png */

for(
  let i = 1;
  i <= TOTAL_PHOTOS;
  i++
){

  const photo =
    document.createElement(
      "div"
    );

  photo.className =
    "photo";

  photo.dataset.index =
    i - 1;


  const image =
    document.createElement(
      "img"
    );

  image.src =
    `image${i}.png`;

  image.alt =
    `Memory ${i}`;

  image.draggable =
    false;


  photo.appendChild(
    image
  );

  photoTrack.appendChild(
    photo
  );

}


const photos =
  Array.from(
    document.querySelectorAll(
      ".photo"
    )
  );


let photoIndex = 0;


/* Move current photo to center */

function showPhoto(
  index,
  animate = true
){

  index =
    Math.max(
      0,
      Math.min(
        index,
        TOTAL_PHOTOS - 1
      )
    );


  photoIndex =
    index;


  const current =
    photos[index];


  const gap =
    parseFloat(
      getComputedStyle(
        photoTrack
      ).gap
    ) || 12;


  const width =
    current.offsetWidth;


  const windowWidth =
    photoWindow.clientWidth;


  const x =
    (windowWidth - width) / 2
    -
    index * (width + gap);


  photoTrack.style.transition =
    animate
      ? "transform .6s cubic-bezier(.22,.61,.36,1)"
      : "none";


  photoTrack.style.transform =
    `translate3d(${x}px,0,0)`;


  photos.forEach(
    (photo,i)=>{

      photo.classList.toggle(
        "active",
        i === index
      );

    }
  );


  photoCurrent.textContent =
    String(index + 1)
      .padStart(2,"0");

}


/* Initial */

window.addEventListener(
  "load",
  ()=>{
    showPhoto(
      0,
      false
    );
  }
);


/* Keep center correct on resize */

window.addEventListener(
  "resize",
  ()=>{
    showPhoto(
      photoIndex,
      false
    );
  }
);


/* Buttons */

document
  .getElementById(
    "photoNext"
  )
  .addEventListener(
    "click",
    ()=>{
      showPhoto(
        photoIndex + 1
      );
    }
  );


document
  .getElementById(
    "photoPrev"
  )
  .addEventListener(
    "click",
    ()=>{
      showPhoto(
        photoIndex - 1
      );
    }
  );


/* =====================================================
   TOUCH SWIPE
   Only changes PHOTO
===================================================== */

let startX = 0;
let startY = 0;


photoWindow.addEventListener(
  "touchstart",
  (event)=>{

    startX =
      event.touches[0]
        .clientX;

    startY =
      event.touches[0]
        .clientY;

  },
  {
    passive:true
  }
);


photoWindow.addEventListener(
  "touchend",
  (event)=>{

    const endX =
      event.changedTouches[0]
        .clientX;

    const endY =
      event.changedTouches[0]
        .clientY;


    const differenceX =
      endX - startX;

    const differenceY =
      endY - startY;


    /* Ignore vertical movement */

    if(
      Math.abs(differenceX) < 45 ||
      Math.abs(differenceY) > 90
    ){

      return;

    }


    if(
      differenceX < 0
    ){

      showPhoto(
        photoIndex + 1
      );

    }else{

      showPhoto(
        photoIndex - 1
      );

    }

  },
  {
    passive:true
  }
);


/* =====================================================
   MUSIC SYSTEM
===================================================== */

const songs = [

  {
    name:
      "Birthday Song",

    artist:
      "A little song for you ✨",

    file:
      "aarzu.mp3"

  },

  {
    name:
      "Our Little Memory",

    artist:
      "For this beautiful story 💗",

    file:
      "veere.mp3"

  }

];


const audio =
  new Audio();


audio.preload =
  "auto";

audio.volume =
  0.65;


let songIndex = 0;


const songName =
  document.getElementById(
    "songName"
  );


const artist =
  document.getElementById(
    "artist"
  );


const playPause =
  document.getElementById(
    "playPause"
  );


const previousSong =
  document.getElementById(
    "previousSong"
  );


const nextSong =
  document.getElementById(
    "nextSong"
  );


const progress =
  document.getElementById(
    "progress"
  );


const currentTime =
  document.getElementById(
    "currentTime"
  );


const duration =
  document.getElementById(
    "duration"
  );


/* Format timestamp */

function formatTime(
  seconds
){

  if(
    !Number.isFinite(
      seconds
    )
  ){

    return "0:00";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    Math.floor(
      seconds % 60
    );


  return (
    minutes +
    ":" +
    String(secs)
      .padStart(2,"0")
  );

}


/* Load song */

function loadSong(
  index,
  shouldPlay = false
){

  songIndex =
    (
      index +
      songs.length
    ) %
    songs.length;


  const song =
    songs[songIndex];


  audio.src =
    song.file;


  songName.textContent =
    song.name;


  artist.textContent =
    song.artist;


  progress.value =
    0;


  currentTime.textContent =
    "0:00";


  duration.textContent =
    "0:00";


  if(
    shouldPlay
  ){

    audio.play()
      .catch(
        ()=>{}
      );

  }

}


/* Play / Pause */

playPause.addEventListener(
  "click",
  ()=>{

    if(
      audio.paused
    ){

      audio.play()
        .catch(
          ()=>{}
        );

    }else{

      audio.pause();

    }

  }
);


/* Previous song */

previousSong.addEventListener(
  "click",
  ()=>{

    loadSong(
      songIndex - 1,
      true
    );

  }
);


/* Next song */

nextSong.addEventListener(
  "click",
  ()=>{

    loadSong(
      songIndex + 1,
      true
    );

  }
);


/* Play icon */

audio.addEventListener(
  "play",
  ()=>{

    playPause.textContent =
      "Ⅱ";

  }
);


/* Pause icon */

audio.addEventListener(
  "pause",
  ()=>{

    playPause.textContent =
      "▶";

  }
);


/* Metadata loaded */

audio.addEventListener(
  "loadedmetadata",
  ()=>{

    duration.textContent =
      formatTime(
        audio.duration
      );

  }
);


/* Update progress */

audio.addEventListener(
  "timeupdate",
  ()=>{

    currentTime.textContent =
      formatTime(
        audio.currentTime
      );


    if(
      audio.duration
    ){

      progress.value =
        (
          audio.currentTime /
          audio.duration
        ) * 100;

    }

  }
);


/* Seek */

progress.addEventListener(
  "input",
  ()=>{

    if(
      audio.duration
    ){

      audio.currentTime =
        (
          progress.value /
          100
        ) *
        audio.duration;

    }

  }
);


/* Song finished */

audio.addEventListener(
  "ended",
  ()=>{

    loadSong(
      songIndex + 1,
      true
    );

  }
);


/* =====================================================
   FIRST SONG
===================================================== */

loadSong(
  0,
  false
);


/*
  Try autoplay immediately.
  Browser may block audible autoplay.
*/

window.addEventListener(
  "load",
  ()=>{

    audio.play()
      .catch(
        ()=>{}
      );

  }
);


/*
  If autoplay was blocked,
  first touch/click starts song1.
*/

function startAfterInteraction(){

  if(
    audio.paused
  ){

    audio.play()
      .catch(
        ()=>{}
      );

  }


  document.removeEventListener(
    "pointerdown",
    startAfterInteraction
  );

}


document.addEventListener(
  "pointerdown",
  startAfterInteraction,
  {
    passive:true
  }
);

  window.addEventListener("load", () => {
  audio.play().catch(() => {});
});
  
</script>

</body>
</html>
